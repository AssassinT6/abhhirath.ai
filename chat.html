<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abhirath AI Chat</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #0f0f1a;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 15px;
    background: #1a1a2e;
    text-align: center;
    font-weight: bold;
  }

  #chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
  }

  .msg {
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 70%;
  }

  .user {
    background: #6c63ff;
    margin-left: auto;
    text-align: right;
  }

  .bot {
    background: rgba(255,255,255,0.1);
    margin-right: auto;
  }

  .input-box {
    display: flex;
    padding: 10px;
    background: #1a1a2e;
  }

  input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
  }

  button {
    margin-left: 10px;
    padding: 10px 15px;
    background: #6c63ff;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>Abhirath AI Chat 🤖</header>

<div id="chat"></div>

<div class="input-box">
  <input id="input" placeholder="Type a message..." />
  <button onclick="sendMsg()">Send</button>
</div>

<script>
function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 9999;
}

function sendMsg() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  setTimeout(() => {
    addMsg("Abhirath AI: You said → " + text, "bot");
  }, 500);
}
</script>

</body>
</html>
